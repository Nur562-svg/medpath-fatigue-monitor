<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedPath 驾驶员疲劳实时监测</title>
  <style>
    :root {
      --bg: #0c1017;
      --surface: #141a24;
      --surface-2: #1c2433;
      --border: #2a3447;
      --text: #eef2f7;
      --text-secondary: #9aa8bc;
      --accent: #4f8cff;
      --green: #34d399;
      --yellow: #fbbf24;
      --orange: #fb923c;
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      height: 56px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f8cff, #3b6fd9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: white;
    }

    .brand h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .brand span {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    .header-right {
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--surface-2);
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px;
      padding: 20px 24px;
      max-width: 1280px;
      margin: 0 auto;
    }

    @media (max-width: 920px) {
      .main { grid-template-columns: 1fr; }
    }

    .video-card {
      position: relative;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 16/10;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    .video-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #cbd5e1;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(12, 16, 23, 0.85);
      gap: 12px;
      z-index: 5;
    }

    .loading-overlay.hidden { display: none; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .side {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .card-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .level-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .level-main {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .level-normal { color: var(--green); }
    .level-mild { color: var(--yellow); }
    .level-moderate { color: var(--orange); }
    .level-severe { color: var(--red); }

    .level-score {
      font-size: 13px;
      color: var(--text-secondary);
      background: var(--surface-2);
      padding: 4px 10px;
      border-radius: 6px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .metric {
      background: var(--surface-2);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
    }

    .metric-name {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .advice {
      border-radius: 10px;
      padding: 14px 16px;
      background: rgba(79, 140, 255, 0.08);
      border: 1px solid rgba(79, 140, 255, 0.2);
    }

    .advice.severe {
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.28);
    }

    .advice-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #93c5fd;
    }

    .advice.severe .advice-title {
      color: #fca5a5;
    }

    .advice-body {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      height: 40px;
      border-radius: 9px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    #startBtn {
      background: var(--accent);
      color: white;
    }
    #startBtn:hover:not(:disabled) { background: #3b7aef; }
    #startBtn:disabled {
      background: #2a3447;
      color: #64748b;
      cursor: not-allowed;
    }

    #stopBtn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    #stopBtn:hover:not(:disabled) {
      border-color: #4b5c78;
      color: var(--text);
    }
    #stopBtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .log-list {
      max-height: 140px;
      overflow-y: auto;
      font-size: 12.5px;
    }

    .log-item {
      display: flex;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .log-item:last-child { border-bottom: none; }

    .log-time {
      color: #64748b;
      min-width: 58px;
      font-variant-numeric: tabular-nums;
    }

    .log-msg { color: var(--text-secondary); }

    .footer {
      text-align: center;
      padding: 14px;
      font-size: 12px;
      color: #4b5c78;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-mark">M</div>
      <h1>MedPath <span>驾驶员疲劳监测</span></h1>
    </div>
    <div class="header-right">AI + 交通安全 · 创新组原型</div>
  </header>

  <div class="main">
    <div class="video-card">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="video-footer">
        <span id="fpsText">FPS --</span>
        <span id="modelStatus">模型加载中</span>
      </div>
      <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div style="font-size:14px;color:#94a3b8">正在加载视觉模型...</div>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="card-label">当前状态</div>
        <div class="level-row">
          <div class="level-main level-normal" id="levelText">正常</div>
          <div class="level-score">评分 <span id="scoreValue">0</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">健康与应急建议</div>
        <div class="advice" id="adviceBox">
          <div class="advice-title" id="adviceTitle">系统就绪</div>
          <div class="advice-body" id="adviceText">点击下方「开始监测」后，系统将实时分析面部关键点并给出建议。</div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">实时指标</div>
        <div class="metrics-grid">
          <div class="metric">
            <div class="metric-name">眼睛 EAR</div>
            <div class="metric-val" id="earValue">--</div>
          </div>
          <div class="metric">
            <div class="metric-name">嘴巴 MAR</div>
            <div class="metric-val" id="marValue">--</div>
          </div>
          <div class="metric">
            <div class="metric-name">俯仰角</div>
            <div class="metric-val" id="pitchValue">--°</div>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button id="startBtn" disabled>开始监测</button>
        <button id="stopBtn" disabled>停止</button>
      </div>

      <div class="card" style="flex:1">
        <div class="card-label">会话记录</div>
        <div class="log-list" id="logBox">
          <div class="log-item">
            <span class="log-time">--:--:--</span>
            <span class="log-msg">等待开始</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    MedPath 原型 · 医学 + 计算机视觉跨界验证 · 仅供大赛演示
  </footer>

  <script type="module">
    import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    const EAR_TH = 0.21;
    const MAR_TH = 0.52;
    const PITCH_TH = 12;
    const SMOOTH = 6;

    const ADVICE = {
      normal: {
        title: "状态正常",
        text: "未检测到明显疲劳信号。请保持专注，建议每驾驶 2 小时适当休息一次。"
      },
      mild: {
        title: "轻度疲劳提醒",
        text: "出现轻度疲劳迹象。建议适当补水并保持注意力。可轻轻按压合谷穴或太阳穴约 30 秒，帮助缓解眼部疲劳。"
      },
      moderate: {
        title: "中度疲劳警告",
        text: "检测到中度疲劳。建议尽快寻找安全地点靠边停车，休息 10–15 分钟并补充水分。可尝试腹式呼吸或按压内关穴辅助缓解。"
      },
      severe: {
        title: "重度疲劳！立即处理",
        text: "检测到明显疲劳信号。【请立即安全停车】并打开双闪。如有不适请及时呼叫家人或救援，切勿继续驾驶。"
      }
    };

    let faceLandmarker = null;
    let running = false;
    let video, canvas, ctx;
    let lastVideoTime = -1;
    let animId = null;

    let earHist = [], marHist = [], pitchHist = [], scoreHist = [];
    let lastLevel = "normal";
    let frameCount = 0;
    let lastFpsTime = performance.now();

    const $ = id => document.getElementById(id);
    const startBtn = $("startBtn");
    const stopBtn = $("stopBtn");
    const levelText = $("levelText");
    const earValue = $("earValue");
    const marValue = $("marValue");
    const pitchValue = $("pitchValue");
    const scoreValue = $("scoreValue");
    const adviceBox = $("adviceBox");
    const adviceTitle = $("adviceTitle");
    const adviceText = $("adviceText");
    const logBox = $("logBox");
    const fpsText = $("fpsText");
    const modelStatus = $("modelStatus");
    const loading = $("loading");

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function earOf(landmarks, idx) {
      const [p1, p2, p3, p4, p5, p6] = idx.map(i => landmarks[i]);
      return (dist(p2, p6) + dist(p3, p5)) / (2 * dist(p1, p4));
    }

    function marOf(landmarks) {
      const v = dist(landmarks[13], landmarks[14]);
      const h = dist(landmarks[78], landmarks[308]);
      return v / h;
    }

    function pitchFromMatrix(matrixData) {
      const r20 = matrixData[8];
      const r21 = matrixData[9];
      const r22 = matrixData[10];
      const pitch = Math.atan2(-r20, Math.sqrt(r21 * r21 + r22 * r22)) * (180 / Math.PI);
      return pitch;
    }

    function pitchFromLandmarks(landmarks) {
      const chin = landmarks[152];
      const leftEye = landmarks[33];
      const rightEye = landmarks[263];
      const eyeMidY = (leftEye.y + rightEye.y) / 2;
      const faceH = dist(landmarks[10], chin);
      const ratio = (chin.y - eyeMidY) / faceH;
      return (ratio - 0.58) * 90;
    }

    function avg(arr) {
      return arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
    }

    function push(arr, v, max = SMOOTH) {
      arr.push(v);
      if (arr.length > max) arr.shift();
    }

    function nowStr() {
      return new Date().toTimeString().slice(0, 8);
    }

    function log(msg) {
      const el = document.createElement("div");
      el.className = "log-item";
      el.innerHTML = `<span class="log-time">${nowStr()}</span><span class="log-msg">${msg}</span>`;
      logBox.prepend(el);
      while (logBox.children.length > 25) logBox.lastChild.remove();
    }

    function setLevel(level, score) {
      const map = {
        normal:   { t: "正常",     c: "level-normal" },
        mild:     { t: "轻度疲劳", c: "level-mild" },
        moderate: { t: "中度疲劳", c: "level-moderate" },
        severe:   { t: "重度疲劳", c: "level-severe" }
      };
      const m = map[level];
      levelText.textContent = m.t;
      levelText.className = "level-main " + m.c;
      scoreValue.textContent = Math.round(score);

      const adv = ADVICE[level];
      adviceTitle.textContent = adv.title;
      adviceText.textContent = adv.text;
      adviceBox.className = "advice" + (level === "severe" ? " severe" : "");

      if (level !== lastLevel && level !== "normal") {
        log(`触发：${m.t}`);
        lastLevel = level;
      }
      if (level === "normal") lastLevel = "normal";
    }

    function process(landmarks, matrixData) {
      const leftEAR = earOf(landmarks, [33, 160, 158, 133, 153, 144]);
      const rightEAR = earOf(landmarks, [362, 385, 387, 263, 373, 380]);
      const ear = (leftEAR + rightEAR) / 2;
      const mar = marOf(landmarks);

      let pitch;
      if (matrixData) {
        pitch = pitchFromMatrix(matrixData);
      } else {
        pitch = pitchFromLandmarks(landmarks);
      }

      push(earHist, ear);
      push(marHist, mar);
      push(pitchHist, pitch);

      const sEAR = avg(earHist);
      const sMAR = avg(marHist);
      const sPitch = avg(pitchHist);

      let score = 0;

      if (sEAR < EAR_TH) {
        score += 48 * (1 - sEAR / EAR_TH);
      } else if (sEAR < 0.27) {
        score += 12 * (1 - (sEAR - EAR_TH) / (0.27 - EAR_TH));
      }

      if (sMAR > MAR_TH) {
        score += 32 * Math.min(1, (sMAR - MAR_TH) / 0.28);
      }

      if (sPitch > PITCH_TH) {
        score += 28 * Math.min(1, (sPitch - PITCH_TH) / 20);
      }

      score = Math.min(100, Math.max(0, score));
      push(scoreHist, score, 8);
      const sScore = avg(scoreHist);

      let level = "normal";
      if (sScore >= 62) level = "severe";
      else if (sScore >= 38) level = "moderate";
      else if (sScore >= 16) level = "mild";

      earValue.textContent = sEAR.toFixed(3);
      marValue.textContent = sMAR.toFixed(3);
      pitchValue.textContent = sPitch.toFixed(1) + "°";
      setLevel(level, sScore);
    }

    function loop() {
      if (!running || !faceLandmarker) return;

      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const res = faceLandmarker.detectForVideo(video, now);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (res.faceLandmarks?.length) {
          const lm = res.faceLandmarks[0];
          const mat = res.facialTransformationMatrixes?.[0]?.data || null;
          process(lm, mat);

          const draw = new DrawingUtils(ctx);
          draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#4f8cff22", lineWidth: 0.4 });
          draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, { color: "#34d399", lineWidth: 1.2 });
          draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, { color: "#34d399", lineWidth: 1.2 });
          draw.drawConnectors(lm, FaceLandmarker.FACE_LANDMARKS_LIPS, { color: "#fb923c", lineWidth: 1.2 });
        } else {
          earValue.textContent = "--";
          marValue.textContent = "--";
          pitchValue.textContent = "--°";
        }

        frameCount++;
        if (now - lastFpsTime >= 1000) {
          fpsText.textContent = `FPS ${frameCount}`;
          frameCount = 0;
          lastFpsTime = now;
        }
      }
      animId = requestAnimationFrame(loop);
    }

    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: true
        });
        modelStatus.textContent = "模型就绪";
        loading.classList.add("hidden");
        startBtn.disabled = false;
        log("视觉模型加载完成");
      } catch (e) {
        console.error(e);
        loading.innerHTML = `<div style="color:#f87171">模型加载失败，请刷新重试</div>`;
        modelStatus.textContent = "加载失败";
        log("模型加载失败");
      }
    }

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video = $("webcam");
        canvas = $("overlay");
        ctx = canvas.getContext("2d");
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        log("开始实时监测");
        loop();
      } catch (e) {
        console.error(e);
        log("摄像头启动失败");
        alert("无法访问摄像头，请检查权限。");
      }
    }

    function stop() {
      running = false;
      if (animId) cancelAnimationFrame(animId);
      if (video?.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      ctx?.clearRect(0, 0, canvas.width, canvas.height);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setLevel("normal", 0);
      earValue.textContent = "--";
      marValue.textContent = "--";
      pitchValue.textContent = "--°";
      log("监测已停止");
    }

    startBtn.addEventListener("click", start);
    stopBtn.addEventListener("click", stop);
    startBtn.disabled = true;
    init();
  </script>
</body>
</html>
