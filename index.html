<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedPath 驾驶员疲劳实时监测原型</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --green: #22c55e;
      --yellow: #eab308;
      --orange: #f97316;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .header .badge {
      font-size: 12px;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .main { grid-template-columns: 1fr; }
    }

    .video-wrap {
      position: relative;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      aspect-ratio: 16/10;
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    #overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .level-display {
      text-align: center;
      padding: 20px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
    }

    .level-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .level-value {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .level-normal { color: var(--green); }
    .level-mild { color: var(--yellow); }
    .level-moderate { color: var(--orange); }
    .level-severe { color: var(--red); }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .metric-name {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .advice-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 10px;
      padding: 14px 16px;
      min-height: 110px;
    }

    .advice-box.severe {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .advice-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #93c5fd;
    }

    .advice-box.severe .advice-title { color: #fca5a5; }

    .advice-content {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    #startBtn {
      background: var(--accent);
      color: white;
    }
    #startBtn:hover { background: #2563eb; }
    #startBtn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    #stopBtn {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    #stopBtn:hover { border-color: #64748b; color: var(--text); }

    .log-box {
      flex: 1;
      overflow-y: auto;
      max-height: 160px;
      font-size: 12px;
      color: var(--muted);
    }

    .log-item {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      display: flex;
      gap: 8px;
    }

    .log-time { color: #64748b; min-width: 52px; }
    .log-msg { color: var(--text); }

    .footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #64748b;
      border-top: 1px solid var(--border);
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      font-size: 15px;
      color: #94a3b8;
      z-index: 10;
    }
    .loading.hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>MedPath · 驾驶员疲劳实时监测原型</h1>
    <div class="badge">AI + 交通安全 · 创新组演示</div>
  </div>

  <div class="main">
    <!-- 左侧视频区 -->
    <div class="video-wrap">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="overlay"></canvas>
      <div class="status-bar">
        <span id="fpsText">FPS: --</span>
        <span id="modelStatus">模型未加载</span>
      </div>
      <div id="loading" class="loading">正在加载视觉模型，请稍候...</div>
    </div>

    <!-- 右侧面板 -->
    <div class="panel">
      <div>
        <div class="panel-title">当前疲劳状态</div>
        <div class="level-display" id="levelBox">
          <div class="level-label">检测等级</div>
          <div class="level-value level-normal" id="levelText">正常</div>
        </div>
      </div>

      <div>
        <div class="panel-title">实时指标</div>
        <div class="metrics">
          <div class="metric">
            <div class="metric-name">眼睛开合 (EAR)</div>
            <div class="metric-value" id="earValue">--</div>
          </div>
          <div class="metric">
            <div class="metric-name">嘴巴开合 (MAR)</div>
            <div class="metric-value" id="marValue">--</div>
          </div>
          <div class="metric">
            <div class="metric-name">头部俯仰</div>
            <div class="metric-value" id="pitchValue">--</div>
          </div>
          <div class="metric">
            <div class="metric-name">综合评分</div>
            <div class="metric-value" id="scoreValue">0</div>
          </div>
        </div>
      </div>

      <div>
        <div class="panel-title">健康与应急建议</div>
        <div class="advice-box" id="adviceBox">
          <div class="advice-title">系统状态</div>
          <div class="advice-content" id="adviceText">点击「开始监测」后，系统将实时分析面部关键点并给出建议。</div>
        </div>
      </div>

      <div class="controls">
        <button id="startBtn">开始监测</button>
        <button id="stopBtn" disabled>停止</button>
      </div>

      <div>
        <div class="panel-title">本次会话记录</div>
        <div class="log-box" id="logBox">
          <div class="log-item"><span class="log-time">--:--:--</span><span class="log-msg">等待开始...</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    MedPath 原型 · 医学 + 计算机视觉跨界验证 · 仅供大赛演示使用
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

    // ===================== 配置 =====================
    const EAR_THRESHOLD = 0.21;      // 低于此值视为闭眼
    const MAR_THRESHOLD = 0.55;      // 高于此值视为张嘴/哈欠
    const PITCH_DOWN_THRESHOLD = 15; // 低头角度阈值（度）
    const SMOOTH_WINDOW = 8;         // 平滑窗口帧数

    // 疲劳建议（应急为主 + 少量中医）
    const ADVICE = {
      normal: {
        title: "状态正常",
        text: "当前未检测到明显疲劳信号。请继续保持专注驾驶，建议每隔 2 小时适当休息。",
        cls: ""
      },
      mild: {
        title: "轻度疲劳提醒",
        text: "出现轻度疲劳迹象。建议适当补水，保持注意力。可轻轻按压合谷穴或太阳穴约 30 秒，帮助缓解眼部疲劳。",
        cls: ""
      },
      moderate: {
        title: "中度疲劳警告",
        text: "检测到中度疲劳。建议尽快寻找安全地点靠边停车，休息 10–15 分钟并补充水分。可尝试 1 分钟腹式呼吸，或按压内关穴辅助缓解。",
        cls: ""
      },
      severe: {
        title: "重度疲劳！立即处理",
        text: "检测到明显疲劳或危险信号。【立即安全停车】，打开双闪警示灯。如身体不适，请及时呼叫家人或救援，切勿继续驾驶。",
        cls: "severe"
      }
    };

    // ===================== 状态 =====================
    let faceLandmarker = null;
    let running = false;
    let video = null;
    let canvas = null;
    let ctx = null;
    let lastVideoTime = -1;
    let animId = null;

    // 平滑队列
    let earHistory = [];
    let marHistory = [];
    let pitchHistory = [];
    let scoreHistory = [];

    let currentLevel = "normal";
    let lastLogLevel = "normal";
    let frameCount = 0;
    let lastFpsTime = performance.now();
    let fps = 0;

    // ===================== DOM =====================
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const levelText = document.getElementById("levelText");
    const levelBox = document.getElementById("levelBox");
    const earValue = document.getElementById("earValue");
    const marValue = document.getElementById("marValue");
    const pitchValue = document.getElementById("pitchValue");
    const scoreValue = document.getElementById("scoreValue");
    const adviceBox = document.getElementById("adviceBox");
    const adviceText = document.getElementById("adviceText");
    const adviceTitle = adviceBox.querySelector(".advice-title");
    const logBox = document.getElementById("logBox");
    const fpsText = document.getElementById("fpsText");
    const modelStatus = document.getElementById("modelStatus");
    const loading = document.getElementById("loading");

    // ===================== 工具函数 =====================
    function distance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 计算眼睛纵横比 (EAR)
    function calcEAR(landmarks, indices) {
      const [p1, p2, p3, p4, p5, p6] = indices.map(i => landmarks[i]);
      const vertical1 = distance(p2, p6);
      const vertical2 = distance(p3, p5);
      const horizontal = distance(p1, p4);
      return (vertical1 + vertical2) / (2 * horizontal);
    }

    // 计算嘴巴纵横比 (MAR)
    function calcMAR(landmarks) {
      // 嘴巴关键点（Face Landmarker 478点模型）
      const top = landmarks[13];
      const bottom = landmarks[14];
      const left = landmarks[78];
      const right = landmarks[308];
      const vertical = distance(top, bottom);
      const horizontal = distance(left, right);
      return vertical / horizontal;
    }

    // 简单头部俯仰估计（用鼻尖与下巴相对位置）
    function calcPitch(landmarks) {
      const nose = landmarks[1];
      const chin = landmarks[152];
      const forehead = landmarks[10];
      // 用 y 方向差异粗略估计
      const faceHeight = distance(forehead, chin);
      const noseToChin = chin.y - nose.y;
      // 归一化后转成大概角度感
      const ratio = noseToChin / faceHeight;
      // 经验映射：正常约 0.35~0.42，低头时变大
      const pitch = (ratio - 0.38) * 120;
      return pitch;
    }

    function average(arr) {
      if (arr.length === 0) return 0;
      return arr.reduce((a, b) => a + b, 0) / arr.length;
    }

    function pushHistory(arr, value, max = SMOOTH_WINDOW) {
      arr.push(value);
      if (arr.length > max) arr.shift();
    }

    function getTimeStr() {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    }

    function addLog(msg) {
      const item = document.createElement("div");
      item.className = "log-item";
      item.innerHTML = `<span class="log-time">${getTimeStr()}</span><span class="log-msg">${msg}</span>`;
      logBox.insertBefore(item, logBox.firstChild);
      // 最多保留 30 条
      while (logBox.children.length > 30) {
        logBox.removeChild(logBox.lastChild);
      }
    }

    function setLevel(level) {
      currentLevel = level;
      const map = {
        normal: { text: "正常", cls: "level-normal" },
        mild: { text: "轻度疲劳", cls: "level-mild" },
        moderate: { text: "中度疲劳", cls: "level-moderate" },
        severe: { text: "重度疲劳", cls: "level-severe" }
      };
      const info = map[level];
      levelText.textContent = info.text;
      levelText.className = "level-value " + info.cls;

      const advice = ADVICE[level];
      adviceTitle.textContent = advice.title;
      adviceText.textContent = advice.text;
      adviceBox.className = "advice-box " + (advice.cls || "");

      if (level !== lastLogLevel && level !== "normal") {
        addLog(`检测到${info.text}`);
        lastLogLevel = level;
      }
      if (level === "normal") lastLogLevel = "normal";
    }

    // ===================== 核心检测 =====================
    function processLandmarks(landmarks) {
      // 左眼索引 (标准 Face Mesh / Landmarker)
      const leftEyeIdx = [33, 160, 158, 133, 153, 144];
      // 右眼
      const rightEyeIdx = [362, 385, 387, 263, 373, 380];

      const leftEAR = calcEAR(landmarks, leftEyeIdx);
      const rightEAR = calcEAR(landmarks, rightEyeIdx);
      const ear = (leftEAR + rightEAR) / 2;

      const mar = calcMAR(landmarks);
      const pitch = calcPitch(landmarks);

      pushHistory(earHistory, ear);
      pushHistory(marHistory, mar);
      pushHistory(pitchHistory, pitch);

      const smoothEAR = average(earHistory);
      const smoothMAR = average(marHistory);
      const smoothPitch = average(pitchHistory);

      // 综合评分（0-100，越高越疲劳）
      let score = 0;

      // 闭眼贡献
      if (smoothEAR < EAR_THRESHOLD) {
        score += 45 * (1 - smoothEAR / EAR_THRESHOLD);
      } else if (smoothEAR < 0.28) {
        score += 15 * (1 - (smoothEAR - EAR_THRESHOLD) / (0.28 - EAR_THRESHOLD));
      }

      // 哈欠贡献
      if (smoothMAR > MAR_THRESHOLD) {
        score += 35 * Math.min(1, (smoothMAR - MAR_THRESHOLD) / 0.3);
      }

      // 低头贡献
      if (smoothPitch > PITCH_DOWN_THRESHOLD) {
        score += 25 * Math.min(1, (smoothPitch - PITCH_DOWN_THRESHOLD) / 25);
      }

      score = Math.min(100, Math.max(0, score));
      pushHistory(scoreHistory, score, 10);
      const smoothScore = average(scoreHistory);

      // 等级判定（带一点滞后，防止跳动）
      let level = "normal";
      if (smoothScore >= 65) level = "severe";
      else if (smoothScore >= 40) level = "moderate";
      else if (smoothScore >= 18) level = "mild";

      // 更新 UI
      earValue.textContent = smoothEAR.toFixed(3);
      marValue.textContent = smoothMAR.toFixed(3);
      pitchValue.textContent = smoothPitch.toFixed(1) + "°";
      scoreValue.textContent = Math.round(smoothScore);

      setLevel(level);

      return { ear: smoothEAR, mar: smoothMAR, pitch: smoothPitch, score: smoothScore };
    }

    // ===================== 主循环 =====================
    async function detect() {
      if (!running || !video || !faceLandmarker) return;

      const now = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const results = faceLandmarker.detectForVideo(video, now);

        // 清空画布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          processLandmarks(landmarks);

          // 画关键点（简化，只画眼睛和嘴巴区域，避免太乱）
          const drawingUtils = new DrawingUtils(ctx);
          // 只画轮廓，保持画面干净
          drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#3b82f644", lineWidth: 0.5 });
          drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE, { color: "#22c55e", lineWidth: 1.5 });
          drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_LEFT_EYE, { color: "#22c55e", lineWidth: 1.5 });
          drawingUtils.drawConnectors(landmarks, FaceLandmarker.FACE_LANDMARKS_LIPS, { color: "#f97316", lineWidth: 1.5 });
        } else {
          // 没有检测到脸
          earValue.textContent = "--";
          marValue.textContent = "--";
          pitchValue.textContent = "--";
        }

        // FPS
        frameCount++;
        if (now - lastFpsTime >= 1000) {
          fps = frameCount;
          frameCount = 0;
          lastFpsTime = now;
          fpsText.textContent = `FPS: ${fps}`;
        }
      }

      animId = requestAnimationFrame(detect);
    }

    // ===================== 初始化 =====================
    async function initModel() {
      try {
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        faceLandmarker = await FaceLandmarker.createFromOptions(filesetResolver, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numFaces: 1,
          outputFaceBlendshapes: false,
          outputFacialTransformationMatrixes: false
        });
        modelStatus.textContent = "模型已就绪";
        loading.classList.add("hidden");
        startBtn.disabled = false;
        addLog("视觉模型加载完成");
      } catch (err) {
        console.error(err);
        loading.textContent = "模型加载失败，请刷新重试";
        modelStatus.textContent = "加载失败";
        addLog("模型加载失败：" + err.message);
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video = document.getElementById("webcam");
        canvas = document.getElementById("overlay");
        ctx = canvas.getContext("2d");

        video.srcObject = stream;
        await video.play();

        // 匹配画布尺寸
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        startBtn.disabled = true;
        stopBtn.disabled = false;
        addLog("开始实时监测");
        detect();
      } catch (err) {
        console.error(err);
        addLog("摄像头启动失败：" + err.message);
        alert("无法访问摄像头，请检查权限后重试。");
      }
    }

    function stopCamera() {
      running = false;
      if (animId) cancelAnimationFrame(animId);
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      ctx && ctx.clearRect(0, 0, canvas.width, canvas.height);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setLevel("normal");
      earValue.textContent = "--";
      marValue.textContent = "--";
      pitchValue.textContent = "--";
      scoreValue.textContent = "0";
      addLog("监测已停止");
    }

    // 事件绑定
    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);

    // 启动时加载模型
    startBtn.disabled = true;
    initModel();
  </script>
</body>
</html>
